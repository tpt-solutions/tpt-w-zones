<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>tpt-zones</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#view">Skip to content</a>
    <header class="topbar">
      <div class="brand">
        <h1>tpt-zones</h1>
        <span id="config-path" class="muted small"></span>
      </div>
      <div class="actions">
        <button id="reload" type="button">Reload from disk</button>
        <button id="revert" type="button" disabled>Revert</button>
        <button id="save" type="button" class="primary" disabled>Save</button>
      </div>
    </header>

    <nav class="tabs" role="tablist">
      <button
        id="tab-layouts"
        type="button"
        role="tab"
        aria-selected="true"
        aria-controls="pane-layouts"
      >
        Layouts
      </button>
      <button
        id="tab-profiles"
        type="button"
        role="tab"
        aria-selected="false"
        aria-controls="pane-profiles"
      >
        Profiles
      </button>
      <button
        id="tab-settings"
        type="button"
        role="tab"
        aria-selected="false"
        aria-controls="pane-settings"
      >
        Settings
      </button>
    </nav>

    <div class="statusbar" aria-live="polite">
      <span id="dirty" class="clean">All changes saved</span>
      <span id="validation" class="notice ok">Configuration is valid.</span>
      <span id="status" class="muted"></span>
    </div>

    <main id="view">
      <section id="pane-layouts" role="tabpanel" aria-labelledby="tab-layouts"></section>
      <section id="pane-profiles" role="tabpanel" aria-labelledby="tab-profiles" hidden></section>
      <section id="pane-settings" role="tabpanel" aria-labelledby="tab-settings" hidden></section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
